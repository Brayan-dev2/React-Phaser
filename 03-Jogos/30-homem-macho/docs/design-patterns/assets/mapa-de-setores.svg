<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Mapa de Setores — Homem Macho</title>
  <desc id="dsc">Grafo das 16 áreas conectadas em um circuito em serpentina. Em destaque dourado, os três setores do MVP: LVL-01 Ruínas da Vigília, LVL-02 Galeria Partida e LVL-03 Portão do Guardião. Setores futuros em cinza. Setores com chefe têm contorno vermelho.</desc>

  <defs>
    <style>
      .edge{stroke:#464052;stroke-width:2;fill:none}
      .edge-mvp{stroke:#F2C66D;stroke-width:2.5;fill:none;opacity:.9}
      .edge-short{stroke:#7FD3C0;stroke-width:2;fill:none;stroke-dasharray:6 5;opacity:.75}
      .box-mvp{fill:#2A2433;stroke:#F2C66D;stroke-width:2}
      .box-post{fill:#1C1926;stroke:#464052;stroke-width:1.5}
      .boss{stroke:#D95555}
      .n{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px}
      .nm{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10.5px;font-weight:500}
      .t-mvp{fill:#F8F7F2}
      .t-post{fill:#9A93A8}
      .t-num-mvp{fill:#F2C66D}
      .t-num-post{fill:#6E6780}
      .lbl{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:9px;fill:#8A8399}
      .lbl-mvp{fill:#F2C66D}
      .act{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10px;font-weight:700;fill:#5A5468;letter-spacing:2.5px}
      .legend{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:11px;fill:#9A93A8}
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#15131F"/>
  <rect x="0" y="0" width="1240" height="700" fill="none" stroke="#2A2433" stroke-width="2"/>

  <text x="40" y="46" class="n" fill="#F8F7F2" font-size="16">HOMEM MACHO — Mapa de Setores</text>
  <text x="40" y="66" class="lbl">Visão completa · 16 áreas conectadas · [SUPOSIÇÃO] sujeita a playtest</text>

  <text x="1220" y="180" class="act" text-anchor="end">ATO IV</text>
  <text x="1220" y="350" class="act" text-anchor="end">ATO III</text>
  <text x="1220" y="520" class="act" text-anchor="end">ATO I–II</text>

  <!-- ===== ARESTAS ===== -->
  <!-- linha 1: 01→06 (esquerda para a direita) -->
  <path class="edge-mvp" d="M200 560 H240"/>
  <path class="edge-mvp" d="M400 560 H440"/>
  <path class="edge"     d="M600 560 H640"/>
  <path class="edge"     d="M800 560 H840"/>
  <path class="edge"     d="M1000 560 H1040"/>
  <!-- 06 sobe para 07 -->
  <path class="edge" d="M1120 528 V422"/>
  <!-- linha 2: 07→12 (direita para a esquerda) -->
  <path class="edge" d="M1040 390 H1000"/>
  <path class="edge" d="M840 390 H800"/>
  <path class="edge" d="M640 390 H600"/>
  <path class="edge" d="M440 390 H400"/>
  <path class="edge" d="M240 390 H200"/>
  <!-- 12 sobe para 13 -->
  <path class="edge" d="M120 358 V252"/>
  <!-- linha 3: 13→16 (esquerda para a direita) -->
  <path class="edge" d="M200 220 H240"/>
  <path class="edge" d="M400 220 H440"/>
  <path class="edge" d="M600 220 H640"/>
  <!-- atalho 03 ↔ 10 -->
  <path class="edge-short" d="M520 528 V422"/>
  <text x="532" y="478" class="lbl">poço · HAB-03</text>

  <!-- rótulos de trava -->
  <text x="420" y="612" class="lbl-mvp" text-anchor="middle">senha</text>
  <text x="620" y="612" class="lbl" text-anchor="middle">chefe</text>

  <!-- ===== LINHA 3 — ATO IV ===== -->
  <rect class="box-post" x="40" y="188" width="160" height="64" rx="4"/>
  <text x="54" y="212" class="n t-num-post">13</text>
  <text x="54" y="234" class="nm t-post">Abismo do Eco</text>

  <rect class="box-post" x="240" y="188" width="160" height="64" rx="4"/>
  <text x="254" y="212" class="n t-num-post">14</text>
  <text x="254" y="234" class="nm t-post">Fortaleza do Eclipse</text>

  <rect class="box-post boss" x="440" y="188" width="160" height="64" rx="4"/>
  <text x="454" y="212" class="n t-num-post">15</text>
  <text x="454" y="234" class="nm t-post">Ante-sala do Fim</text>

  <rect class="box-post boss" x="640" y="188" width="160" height="64" rx="4"/>
  <text x="654" y="212" class="n t-num-post">16</text>
  <text x="654" y="234" class="nm t-post">Trono do Caos</text>

  <!-- ===== LINHA 2 — ATO III ===== -->
  <rect class="box-post" x="40" y="358" width="160" height="64" rx="4"/>
  <text x="54" y="382" class="n t-num-post">12</text>
  <text x="54" y="404" class="nm t-post">Forja Distorcida</text>

  <rect class="box-post" x="240" y="358" width="160" height="64" rx="4"/>
  <text x="254" y="382" class="n t-num-post">11</text>
  <text x="254" y="404" class="nm t-post">Jardim Profanado</text>

  <rect class="box-post" x="440" y="358" width="160" height="64" rx="4"/>
  <text x="454" y="382" class="n t-num-post">10</text>
  <text x="454" y="404" class="nm t-post">Torre da Vigília</text>

  <rect class="box-post" x="640" y="358" width="160" height="64" rx="4"/>
  <text x="654" y="382" class="n t-num-post">09</text>
  <text x="654" y="404" class="nm t-post">Canais Sombrios</text>

  <rect class="box-post boss" x="840" y="358" width="160" height="64" rx="4"/>
  <text x="854" y="382" class="n t-num-post">08</text>
  <text x="854" y="404" class="nm t-post">Pátio Rubro</text>

  <rect class="box-post" x="1040" y="358" width="160" height="64" rx="4"/>
  <text x="1054" y="382" class="n t-num-post">07</text>
  <text x="1054" y="404" class="nm t-post">Catedral Oca</text>

  <!-- ===== LINHA 1 — ATO I–II ===== -->
  <rect class="box-mvp" x="40" y="528" width="160" height="64" rx="4"/>
  <text x="54" y="552" class="n t-num-mvp">01</text>
  <text x="54" y="574" class="nm t-mvp">Ruínas da Vigília</text>

  <rect class="box-mvp" x="240" y="528" width="160" height="64" rx="4"/>
  <text x="254" y="552" class="n t-num-mvp">02</text>
  <text x="254" y="574" class="nm t-mvp">Galeria Partida</text>

  <rect class="box-mvp boss" x="440" y="528" width="160" height="64" rx="4"/>
  <text x="454" y="552" class="n t-num-mvp">03</text>
  <text x="454" y="574" class="nm t-mvp">Portão do Guardião</text>

  <rect class="box-post" x="640" y="528" width="160" height="64" rx="4"/>
  <text x="654" y="552" class="n t-num-post">04</text>
  <text x="654" y="574" class="nm t-post">Bosque das Cinzas</text>

  <rect class="box-post" x="840" y="528" width="160" height="64" rx="4"/>
  <text x="854" y="552" class="n t-num-post">05</text>
  <text x="854" y="574" class="nm t-post">Cripta das Engrenagens</text>

  <rect class="box-post" x="1040" y="528" width="160" height="64" rx="4"/>
  <text x="1054" y="552" class="n t-num-post">06</text>
  <text x="1054" y="574" class="nm t-post">Mina Esquecida</text>

  <!-- ===== LEGENDA ===== -->
  <line x1="40" y1="646" x2="1200" y2="646" stroke="#2A2433" stroke-width="1"/>

  <rect x="40" y="664" width="26" height="14" rx="3" class="box-mvp"/>
  <text x="74" y="676" class="legend">MVP — jogável no recorte</text>

  <rect x="266" y="664" width="26" height="14" rx="3" class="box-post"/>
  <text x="300" y="676" class="legend">Futuro — esboço, não aprovado</text>

  <rect x="502" y="664" width="26" height="14" rx="3" class="box-post boss"/>
  <text x="536" y="676" class="legend">Setor com chefe</text>

  <line x1="676" y1="671" x2="712" y2="671" class="edge-mvp"/>
  <text x="722" y="676" class="legend">Rota do MVP</text>

  <line x1="846" y1="671" x2="882" y2="671" class="edge-short"/>
  <text x="892" y="676" class="legend">Atalho por habilidade</text>

</svg>
